name: Release

# Yeni sürüm: mdviewer/__init__.py içindeki __version__ ve CHANGELOG.md güncellenir,
# ardından "v<sürüm>" etiketi gönderilir:  git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Etiket ile sürüm aynı mı?
        shell: pwsh
        run: |
          $ver = python -c "import mdviewer; print(mdviewer.__version__)"
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "Etiket ${{ github.ref_name }} ile __version__ $ver uyuşmuyor" }

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Testler
        run: python -m unittest discover -s tests -v

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Derle
        run: python tools/build.py

      - name: Sürüm notları
        run: python tools/release_notes.py ${{ github.ref_name }} > dist/RELEASE_NOTES.md

      - name: GitHub Release oluştur
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -ne "RELEASE_NOTES.md" } | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" $files --title "MD Viewer TY ${{ github.ref_name }}" --notes-file dist/RELEASE_NOTES.md
